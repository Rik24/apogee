name: Contributors Sync

# Keeps the README contributors wall current. Regenerates the avatar table
# between the contributors markers from the GitHub contributors API
# (humans only, most commits first) and commits back when it changed.
# Runs on every push to main (any contributor merge triggers a sync),
# weekly, and on demand. The bot commit carries
# [skip ci] and the job ignores bot pushes, so it never loops.
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-contributors:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Regenerate contributors table
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/contributors" --paginate \
            -q '.[] | select(.type == "User") | .login' > /tmp/contributors.txt
          python3 - <<'EOF'
          from pathlib import Path

          users = Path("/tmp/contributors.txt").read_text().split()
          tiles = " ".join(
              f'<a href="https://github.com/{u}">'
              f'<img src="https://github.com/{u}.png?size=100" width="50" '
              f'alt="{u}" /></a>'
              for u in users
          )
          block = (
              "<!-- contributors:start -->\n"
              "<!-- cspell:disable --><!-- contributor usernames are not dictionary words -->\n"
              "<p>\n  " + tiles + "\n</p>\n"
              "<!-- cspell:enable -->\n"
              "<!-- contributors:end -->"
          )

          readme = Path("README.md")
          text = readme.read_text()
          start = text.index("<!-- contributors:start -->")
          end = (
              text.index("<!-- contributors:end -->")
              + len("<!-- contributors:end -->")
          )
          readme.write_text(text[:start] + block + text[end:])
          print(f"{len(users)} contributors in the wall")
          EOF
          git diff --quiet -- README.md && echo "unchanged" || echo "changed"

      - name: Commit back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.md; then
            echo "Contributors wall already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync readme contributors wall [skip ci]"
          # Credentials are not persisted by checkout (artipacked), so
          # authenticate this push explicitly. Another sync job can push
          # first and move main under us; rebase and retry instead of
          # failing the run.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3; do
            echo "push attempt $attempt/3"
            git pull --rebase origin main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
