name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

defaults:
  run:
    working-directory: apogee-extension

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload zips

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No dependency cache here on purpose: setup-node caches by default
      # via packageManager detection, and a poisoned cache in the release
      # job would ship straight to users (zizmor cache-poisoning).
      # Releases are rare; the extra minute of npm ci is worth it.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build and package extension
        run: npm run package

      # gh CLI instead of softprops/action-gh-release: one less third-party
      # action in the release path (zizmor superfluous-actions), same result.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tag name via env, never expanded into the script: ref names are
          # attacker-controllable and would be code injection (zizmor
          # template-injection) if interpolated with ${{ }}.
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" apogee-*-chrome.zip apogee-*-mozilla.xpi --clobber
          else
            gh release create "$TAG" --generate-notes --title "$TAG" apogee-*-chrome.zip apogee-*-mozilla.xpi
          fi

      - name: Publish to Chrome Web Store
        if: env.CWS_CLIENT_ID != ''
        run: |
          ZIP_FILE=$(ls ../apogee-*-chrome.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "Chrome zip not found: ../apogee-*-chrome.zip"
            ls -la ../*.zip 2>/dev/null || ls -la . 2>/dev/null
            exit 1
          fi
          echo "Uploading $ZIP_FILE to Chrome Web Store"
          npx chrome-webstore-upload-cli@4 --source "$ZIP_FILE" --extension-id "$EXTENSION_ID" --publisher-id "$PUBLISHER_ID"
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}

      - name: Publish to Mozilla Add-ons (AMO)
        if: env.AMO_API_KEY != ''
        run: |
          npx web-ext sign \
            --source-dir dist/firefox \
            --api-key ${{ secrets.AMO_API_KEY }} \
            --api-secret ${{ secrets.AMO_API_SECRET }}
        env:
          AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
          AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
